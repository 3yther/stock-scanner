<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T-SKiLL — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Notch:wght@200..700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: 'Stack Sans Notch', 'Space Grotesk', 'Barlow', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Layer 0: deep navy gradient, fades in during graphic phase ── */
    #bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 28% 52%, #0B1628 0%, transparent 62%),
        radial-gradient(ellipse at 72% 60%, #130728 0%, transparent 60%),
        linear-gradient(155deg, #020810 0%, #060B1E 45%, #0C0420 100%);
      opacity: 0;
      transition: opacity 3.2s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 0;
    }

    /* ── Layer 1: canvas for geometric shapes ── */
    #canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    /* ── Layer 2: text ── */
    #text-stage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(0.85rem, 2.2vh, 1.7rem);
      z-index: 10;
      pointer-events: none;
      padding: 2rem;
    }

    .line {
      font-size: clamp(0.9rem, 2.1vw, 1.5rem);
      font-weight: 300;
      letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.87);
      text-align: center;
      opacity: 0;
      transform: translateY(16px);
      transition:
        opacity 1.7s cubic-bezier(0.22, 1, 0.36, 1),
        transform 1.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .line.in {
      opacity: 1;
      transform: translateY(0);
    }

    .line.out {
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 1.1s ease, transform 1.1s ease;
    }

    /* ── Layer 3: logo ── */
    #logo-stage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(0.55rem, 1.5vh, 1rem);
      z-index: 20;
      pointer-events: none;
      opacity: 0;
    }

    #logo {
      font-size: clamp(3rem, 8.5vw, 7rem);
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.13em;
      text-shadow:
        0 0 55px rgba(107, 92, 231, 0.55),
        0 0 110px rgba(107, 92, 231, 0.22),
        0 0 200px rgba(30, 58, 138, 0.18);
      opacity: 0;
      transform: translateY(12px) scale(0.97);
      transition:
        opacity 3s cubic-bezier(0.16, 1, 0.3, 1),
        transform 3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #logo.in {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    #tagline {
      font-size: clamp(0.56rem, 1.3vw, 0.8rem);
      font-weight: 400;
      color: #6B5CE7;
      letter-spacing: 0.44em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(7px);
      transition: opacity 2.2s ease, transform 2.2s ease;
    }

    #tagline.in {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Replay button (hidden in corner) ── */
    #replay-btn {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: transparent;
      border: 1px solid rgba(107, 92, 231, 0.18);
      color: rgba(107, 92, 231, 0.38);
      padding: 0.42rem 0.9rem;
      font-family: inherit;
      font-size: 0.56rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 3px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.9s ease, background 0.28s, color 0.28s, border-color 0.28s;
    }

    #replay-btn.show {
      opacity: 1;
      pointer-events: auto;
    }

    #replay-btn:hover {
      background: rgba(107, 92, 231, 0.09);
      color: rgba(107, 92, 231, 0.9);
      border-color: rgba(107, 92, 231, 0.48);
    }
  </style>
</head>
<body>

<div id="bg"></div>
<canvas id="canvas"></canvas>

<div id="text-stage">
  <p class="line" id="l1">We are making something.</p>
  <p class="line" id="l2">Something to help you revise.</p>
  <p class="line" id="l3">But we're planning a whole lot more.</p>
  <p class="line" id="l4">We'll tell you when it's ready.</p>
</div>

<div id="logo-stage">
  <div id="logo">T-SKiLL</div>
  <div id="tagline">coming soon</div>
</div>

<button id="replay-btn">Replay</button>

<script>
!function () {
  'use strict';

  // ── Canvas setup ─────────────────────────────────────────────────────────────
  const cv = document.getElementById('canvas');
  const cx = cv.getContext('2d');
  let W, H;

  function resize() {
    W = cv.width = window.innerWidth;
    H = cv.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', function () { resize(); if (shapesReady) buildShapes(); });

  // ── Shape pool ────────────────────────────────────────────────────────────────
  // Each shape: { t, x, y, r, vx, vy, rot, vr, col, maxA, a, delay, ... }
  let shapes = [];
  let shapesReady = false;
  let graphicOn = false;
  let graphicT = 0;

  function buildShapes() {
    const m = Math.min(W, H);
    shapes = [
      // ── Soft glow orbs (rendered blurred, deepest layer)
      { t:'orb', x:W*0.27, y:H*0.50, r:m*0.40, vx: 0.013, vy: 0.009, rot:0, vr:0, col:[18,48,128],  maxA:0.62, a:0, delay:0    },
      { t:'orb', x:W*0.73, y:H*0.58, r:m*0.46, vx:-0.016, vy:-0.008, rot:0, vr:0, col:[82,24,132],  maxA:0.50, a:0, delay:350  },
      { t:'orb', x:W*0.52, y:H*0.24, r:m*0.22, vx: 0.007, vy: 0.018, rot:0, vr:0, col:[58,48,198],  maxA:0.42, a:0, delay:650  },
      { t:'orb', x:W*0.62, y:H*0.82, r:m*0.28, vx:-0.011, vy:-0.014, rot:0, vr:0, col:[25,52,140],  maxA:0.38, a:0, delay:900  },

      // ── Arc shapes (thin, precise, crisp)
      { t:'arc', x:W*0.50, y:H*0.50, r:m*0.47, sa:-0.55,          sw:Math.PI*1.18, rot: 0.12, vx: 0.006, vy: 0.004, vr: 0.00028, lw:0.65, col:[96,165,250],  maxA:0.42, a:0, delay:60   },
      { t:'arc', x:W*0.34, y:H*0.53, r:m*0.34, sa:Math.PI*0.22,   sw:Math.PI*1.55, rot:-0.18, vx: 0.012, vy:-0.008, vr: 0.00055, lw:0.55, col:[139,92,246],  maxA:0.46, a:0, delay:320  },
      { t:'arc', x:W*0.68, y:H*0.43, r:m*0.27, sa:Math.PI*0.62,   sw:Math.PI*1.42, rot: 0.88, vx:-0.008, vy: 0.012, vr:-0.00038, lw:0.50, col:[99,102,241],  maxA:0.36, a:0, delay:600  },
      { t:'arc', x:W*0.17, y:H*0.31, r:m*0.18, sa:0,              sw:Math.PI*1.08, rot: 2.05, vx: 0.020, vy: 0.015, vr: 0.00085, lw:0.72, col:[129,140,248], maxA:0.30, a:0, delay:870  },
      { t:'arc', x:W*0.81, y:H*0.76, r:m*0.22, sa:Math.PI*1.05,   sw:Math.PI*0.92, rot:-1.18, vx:-0.013, vy:-0.018, vr: 0.00062, lw:0.58, col:[167,139,250], maxA:0.28, a:0, delay:1080 },
      { t:'arc', x:W*0.44, y:H*0.15, r:m*0.14, sa:Math.PI*0.4,    sw:Math.PI*1.3,  rot: 1.4,  vx: 0.016, vy: 0.022, vr:-0.0007,  lw:0.45, col:[147,197,253], maxA:0.25, a:0, delay:1300 },

      // ── Polygon outlines (subtle, geometric anchors)
      { t:'poly', x:W*0.50, y:H*0.50, r:m*0.28, sides:6, rot:Math.PI/6,  vx:-0.006, vy:-0.004, vr: 0.00022, lw:0.42, col:[59,130,246],  maxA:0.17, a:0, delay:180  },
      { t:'poly', x:W*0.71, y:H*0.27, r:m*0.039, sides:4, rot:Math.PI/4, vx:-0.026, vy: 0.020, vr: 0.00170, lw:0.88, col:[167,139,250], maxA:0.56, a:0, delay:820  },
      { t:'poly', x:W*0.29, y:H*0.73, r:m*0.050, sides:5, rot: 0.38,    vx: 0.017, vy:-0.021,  vr:-0.00135, lw:0.88, col:[129,140,248], maxA:0.50, a:0, delay:1020 },
      { t:'poly', x:W*0.14, y:H*0.64, r:m*0.026, sides:3, rot: 0.22,    vx: 0.030, vy: 0.014,  vr: 0.00190, lw:0.80, col:[99,102,241],  maxA:0.40, a:0, delay:1260 },
      { t:'poly', x:W*0.88, y:H*0.38, r:m*0.032, sides:6, rot: 0.5,     vx:-0.022, vy: 0.018,  vr:-0.00140, lw:0.75, col:[107,92,231],  maxA:0.38, a:0, delay:1450 },
    ];
    shapesReady = true;
  }

  function rgba(col, a) {
    return 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',' + a + ')';
  }

  function updateShape(s, dt) {
    if (graphicT > s.delay) {
      var rate = s.maxA / 2500;
      s.a = Math.min(s.maxA, s.a + rate * dt);
    }
    s.x += s.vx;
    s.y += s.vy;
    s.rot += s.vr;
    var wrap = s.r * 2.8;
    if (s.x < -wrap)    s.x = W + wrap;
    if (s.x > W + wrap) s.x = -wrap;
    if (s.y < -wrap)    s.y = H + wrap;
    if (s.y > H + wrap) s.y = -wrap;
  }

  function drawOrb(s) {
    if (s.a < 0.005) return;
    cx.save();
    var blur = Math.round(s.r * 0.82);
    cx.filter = 'blur(' + blur + 'px)';
    var g = cx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r);
    g.addColorStop(0,    rgba(s.col, s.a));
    g.addColorStop(0.45, rgba(s.col, s.a * 0.38));
    g.addColorStop(1,    rgba(s.col, 0));
    cx.fillStyle = g;
    cx.beginPath();
    cx.arc(s.x, s.y, s.r * 1.6, 0, Math.PI * 2);
    cx.fill();
    cx.filter = 'none';
    cx.restore();
  }

  function drawArc(s) {
    if (s.a < 0.005) return;
    cx.save();
    cx.translate(s.x, s.y);
    cx.rotate(s.rot);
    cx.beginPath();
    cx.arc(0, 0, s.r, s.sa, s.sa + s.sw);
    cx.strokeStyle = rgba(s.col, s.a);
    cx.lineWidth = s.lw;
    cx.stroke();
    cx.restore();
  }

  function drawPoly(s) {
    if (s.a < 0.005) return;
    cx.save();
    cx.translate(s.x, s.y);
    cx.rotate(s.rot);
    cx.beginPath();
    for (var i = 0; i <= s.sides; i++) {
      var angle = (i / s.sides) * Math.PI * 2;
      var px = Math.cos(angle) * s.r;
      var py = Math.sin(angle) * s.r;
      i === 0 ? cx.moveTo(px, py) : cx.lineTo(px, py);
    }
    cx.closePath();
    cx.strokeStyle = rgba(s.col, s.a);
    cx.lineWidth = s.lw;
    cx.stroke();
    cx.restore();
  }

  // ── Render loop ───────────────────────────────────────────────────────────────
  var lastT = 0;

  function frame(ts) {
    var dt = lastT ? Math.min(ts - lastT, 50) : 16;
    lastT = ts;

    cx.clearRect(0, 0, W, H);

    if (graphicOn && shapesReady) {
      graphicT += dt;
      for (var i = 0; i < shapes.length; i++) updateShape(shapes[i], dt);
      // Orbs first (soft, behind), then crisp line shapes on top
      for (var i = 0; i < shapes.length; i++) { if (shapes[i].t === 'orb')  drawOrb(shapes[i]);  }
      for (var i = 0; i < shapes.length; i++) { if (shapes[i].t === 'arc')  drawArc(shapes[i]);  }
      for (var i = 0; i < shapes.length; i++) { if (shapes[i].t === 'poly') drawPoly(shapes[i]); }
    }

    requestAnimationFrame(frame);
  }

  // ── DOM refs ──────────────────────────────────────────────────────────────────
  var lines      = [1,2,3,4].map(function(n){ return document.getElementById('l'+n); });
  var textStage  = document.getElementById('text-stage');
  var bgEl       = document.getElementById('bg');
  var logoStage  = document.getElementById('logo-stage');
  var logoEl     = document.getElementById('logo');
  var taglineEl  = document.getElementById('tagline');
  var replayBtn  = document.getElementById('replay-btn');

  var timers = [];
  function after(ms, fn) { timers.push(setTimeout(fn, ms)); }
  function clearAll() { timers.forEach(clearTimeout); timers = []; }

  // ── Sequence ──────────────────────────────────────────────────────────────────
  function run() {
    // Reset
    lines.forEach(function(el){ el.className = 'line'; });
    logoEl.className      = '';
    taglineEl.className   = '';
    textStage.style.cssText = '';
    logoStage.style.opacity = '0';
    bgEl.style.opacity    = '0';
    replayBtn.classList.remove('show');
    graphicOn     = false;
    graphicT      = 0;
    shapesReady   = false;
    lastT         = 0;

    // ── Lines appear one at a time, then hold
    after(700,  function(){ lines[0].classList.add('in'); });
    after(2550, function(){ lines[1].classList.add('in'); });
    after(4500, function(){ lines[2].classList.add('in'); });
    after(6550, function(){ lines[3].classList.add('in'); });

    // ── Text fades out
    after(9400, function(){
      lines.forEach(function(el){ el.classList.remove('in'); el.classList.add('out'); });
      textStage.style.transition = 'opacity 1.4s ease';
      textStage.style.opacity    = '0';
    });

    // ── Graphic phase begins
    after(10300, function(){
      buildShapes();
      graphicOn      = true;
      bgEl.style.opacity = '1';
    });

    // ── Logo emerges from the shapes
    after(14200, function(){
      logoStage.style.transition = 'none';
      logoStage.style.opacity    = '1';
      setTimeout(function(){ logoEl.classList.add('in'); }, 60);
    });

    // ── "coming soon" fades in last
    after(16200, function(){ taglineEl.classList.add('in'); });

    // ── Replay button appears
    after(18000, function(){ replayBtn.classList.add('show'); });
  }

  replayBtn.addEventListener('click', function(){
    clearAll();
    run();
  });

  requestAnimationFrame(frame);
  run();

}();
</script>
</body>
</html>
