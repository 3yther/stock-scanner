<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⟢ Event Horizon Capital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --cyan:#00eaff; --pink:#ff2bd6; --eblue:#4d7cff; --gold:#00eaff; --text:#dbe7ff; --muted:#5d6f99; --mono:'JetBrains Mono',monospace; }
html, body { height: 100%; }
body {
  background:
    radial-gradient(circle at 50% 46%, rgba(168,85,247,.18), transparent 40%),
    radial-gradient(circle at 50% 46%, rgba(0,234,255,.10), transparent 60%),
    #03010a;
  color: var(--text); font-family: 'Inter', sans-serif; overflow: hidden; position: relative;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes spin-rev { to { transform: rotate(-360deg); } }
@keyframes twinkle { 0%,100%{opacity:.25} 50%{opacity:1} }
@keyframes pulse { 0%,100%{opacity:.6} 50%{opacity:1} }
@keyframes orbit { to { transform: rotate(360deg); } }

/* WebGL canvas (filled lazily; hidden until ready) */
#bh { position: fixed; inset: 0; z-index: 1; opacity: 0; transition: opacity 1.2s ease; }
#bh.on { opacity: 1; }

/* CSS-only fallback black hole + starfield (always present, behind WebGL) */
#stage { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
.stars { position: absolute; inset: -20%; }
.stars i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; animation: twinkle 3s ease-in-out infinite; }
.css-hole {
  position: absolute; left: 50%; top: 46%; width: 340px; height: 340px; transform: translate(-50%,-50%);
  border-radius: 50%;
  background: radial-gradient(circle, #000 38%, rgba(0,0,0,.9) 41%, transparent 42%);
  box-shadow: 0 0 80px 10px rgba(0,234,255,.10);
}
.css-disk {
  position: absolute; left: 50%; top: 46%; width: 520px; height: 520px; transform: translate(-50%,-50%) rotateX(72deg);
  border-radius: 50%;
  background: conic-gradient(from 0deg, rgba(0,234,255,.0), rgba(0,234,255,.55), rgba(255,43,214,.55), rgba(255,140,20,.45), rgba(0,234,255,0));
  filter: blur(8px); animation: spin 26s linear infinite; opacity: .85;
  -webkit-mask: radial-gradient(circle, transparent 30%, #000 33%, #000 49%, transparent 52%);
          mask: radial-gradient(circle, transparent 30%, #000 33%, #000 49%, transparent 52%);
}
.ring { position:absolute; left:50%; top:46%; width:360px; height:360px; transform:translate(-50%,-50%); border-radius:50%;
  border:1px solid rgba(0,234,255,.5); box-shadow:0 0 26px rgba(0,234,255,.5), inset 0 0 26px rgba(255,43,214,.3); }
@media (max-width:640px){ .css-hole,.css-disk,.ring { width:200px; height:200px; } .css-disk{ width:300px; height:300px; } }

/* Title + content */
.stage-content { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 7vh; pointer-events: none; }
.title { text-align: center; margin-bottom: 3vh; }
.title h1 { font-family: var(--mono); font-size: clamp(1.1rem, 3.4vw, 2.0rem); font-weight: 700; letter-spacing: 6px; color: #fff; text-shadow: 0 0 26px rgba(0,234,255,.6), 0 0 50px rgba(255,43,214,.3); }
.title .sub { font-family: var(--mono); font-size: .62rem; letter-spacing: 5px; color: var(--muted); margin-top: 12px; }

/* Portals */
.portals { display: flex; gap: clamp(20px, 7vw, 90px); pointer-events: auto; }
.portal {
  position: relative; width: clamp(150px, 22vw, 230px); text-decoration: none; color: inherit;
  display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 22px 18px;
  border-radius: 14px; background: rgba(8,6,24,.55); backdrop-filter: blur(8px);
  border: 1px solid rgba(0,234,255,.18); transition: transform .25s, box-shadow .25s, border-color .25s;
  box-shadow: 0 0 0 1px rgba(0,234,255,.05), 0 14px 40px rgba(0,0,0,.6);
}
.portal .orb { width: 54px; height: 54px; border-radius: 50%; position: relative; }
.portal.scanner .orb { background: radial-gradient(circle at 35% 30%, #8fefff, #00b8d4 55%, #003a44); box-shadow: 0 0 26px rgba(0,234,255,.7); }
.portal.crypto  .orb { background: radial-gradient(circle at 35% 30%, #ffd27a, #ff8a00 55%, #5a2b00); box-shadow: 0 0 26px rgba(255,140,20,.7); }
.portal .orb::after { content:''; position:absolute; inset:-9px; border-radius:50%; border:1px solid rgba(255,255,255,.18); animation: orbit 8s linear infinite; }
.portal h2 { font-family: var(--mono); font-size: 1.05rem; font-weight: 700; letter-spacing: 2px; }
.portal.scanner h2 { color: var(--cyan); } .portal.crypto h2 { color: var(--gold); }
.portal .desc { font-family: var(--mono); font-size: .58rem; letter-spacing: 1px; color: var(--text); }
.portal .meta { font-family: var(--mono); font-size: .5rem; letter-spacing: 1px; color: var(--muted); }
.portal:hover { transform: translateY(-6px); }
.portal.scanner:hover { border-color: rgba(0,234,255,.7); box-shadow: 0 0 36px rgba(0,234,255,.5), 0 18px 50px rgba(0,0,0,.7); }
.portal.crypto:hover  { border-color: rgba(255,140,20,.7); box-shadow: 0 0 36px rgba(255,140,20,.5), 0 18px 50px rgba(0,0,0,.7); }

footer { position: fixed; bottom: 14px; width: 100%; text-align: center; z-index: 5; font-family: var(--mono); font-size: .5rem; letter-spacing: 2px; color: var(--muted); pointer-events: none; }

/* Intro */
#intro { position: fixed; inset: 0; z-index: 99; background: #03010a; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: opacity .8s; }
#intro .glyph { font-size: 2.2rem; color: var(--cyan); text-shadow: 0 0 40px rgba(0,234,255,.8); animation: pulse 1.6s ease-in-out infinite; }
#intro .t { font-family: var(--mono); font-size: clamp(1rem,4vw,2.2rem); letter-spacing: 8px; color: #fff; margin-top: 18px; text-shadow: 0 0 30px rgba(0,234,255,.6); white-space: pre; }
#intro .hint { position: absolute; bottom: 40px; font-family: var(--mono); font-size: .5rem; letter-spacing: 3px; color: var(--muted); }

/* Fall-in transition */
#stage, #bh, .stage-content { transition: transform 1s cubic-bezier(.6,.05,.2,1), opacity 1s; }
body.diving #stage, body.diving #bh, body.diving .stage-content { opacity: 0; }
body.dive-scanner #stage, body.dive-scanner #bh { transform: scale(6) translateX(-12%); }
body.dive-crypto  #stage, body.dive-crypto  #bh { transform: scale(6) translateX(12%); }
.flash { position: fixed; inset: 0; z-index: 80; opacity: 0; pointer-events: none; transition: opacity .9s; }
.flash.go { opacity: .9; }

@media (prefers-reduced-motion: reduce){
  .css-disk, .portal .orb::after, #intro .glyph { animation: none !important; }
}
</style>
</head>
<body>

<!-- CSS fallback scene (always present) -->
<div id="stage">
  <div class="stars" id="stars"></div>
  <div class="css-disk"></div>
  <div class="ring"></div>
  <div class="css-hole"></div>
</div>

<!-- WebGL canvas (filled lazily) -->
<canvas id="bh"></canvas>

<!-- Dive flash -->
<div class="flash" id="flash"></div>

<!-- Foreground -->
<div class="stage-content">
  <div class="title">
    <h1>⟢ EVENT HORIZON CAPITAL</h1>
    <div class="sub">TWO ENGINES · ONE SINGULARITY · PAPER TRADING</div>
  </div>
  <div class="portals">
    <a href="/scanner" class="portal scanner" data-dive="scanner">
      <div class="orb"></div><h2>SCANNER</h2>
      <div class="desc">US Equities · Momentum</div>
      <div class="meta">MACD · vol-conviction</div>
    </a>
    <a href="/crypto" class="portal crypto" data-dive="crypto">
      <div class="orb"></div><h2>CRYPTO BOT</h2>
      <div class="desc">BTC/ETH · TJR Smart Money</div>
      <div class="meta">sweep · MSS · FVG · regime</div>
    </a>
  </div>
</div>

<footer>EVENT HORIZON CAPITAL · PAPER TRADING ONLY · NOT FINANCIAL ADVICE</footer>

<!-- Intro -->
<div id="intro">
  <div class="glyph">⟢</div>
  <div class="t">EVENT HORIZON</div>
  <div class="hint">CLICK TO ENTER</div>
</div>

<script>
const $ = id => document.getElementById(id);
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || window.innerWidth < 760;

// ── CSS starfield (lightweight fallback, always drawn) ────────────────────
(function stars(){
  const host = $('stars'); const n = isMobile ? 60 : 140; let html = '';
  for (let i=0;i<n;i++){
    const x=Math.random()*100, y=Math.random()*100, d=(Math.random()*3+2).toFixed(1), s=(Math.random()*1.6+0.4).toFixed(1);
    html += `<i style="left:${x}%;top:${y}%;width:${s}px;height:${s}px;animation-duration:${d}s;animation-delay:${(Math.random()*3).toFixed(1)}s"></i>`;
  }
  host.innerHTML = html;
})();

// ── Intro (skippable) ──────────────────────────────────────────────────────
(function intro(){
  const el = $('intro');
  const dismiss = () => { el.style.opacity='0'; setTimeout(()=> el.style.display='none', 800); };
  el.addEventListener('click', dismiss);
  setTimeout(dismiss, reduced ? 600 : 2600);
})();

// ── Dive transition on portal click ────────────────────────────────────────
document.querySelectorAll('.portal').forEach(a => a.addEventListener('click', e => {
  if (reduced){ return; }                          // let the normal navigation happen
  e.preventDefault();
  const which = a.dataset.dive, href = a.getAttribute('href');
  const fl = $('flash');
  fl.style.background = which==='crypto'
    ? 'radial-gradient(circle, rgba(255,140,20,.9), #03010a 70%)'
    : 'radial-gradient(circle, rgba(0,234,255,.9), #03010a 70%)';
  document.body.classList.add('diving', 'dive-'+which);
  setTimeout(()=> fl.classList.add('go'), 250);
  setTimeout(()=> window.location.href = href, 1000);
}));

// ── WebGL black hole (progressive enhancement) ─────────────────────────────
function webglOK(){
  try { const c=document.createElement('canvas'); return !!(window.WebGLRenderingContext && (c.getContext('webgl')||c.getContext('experimental-webgl'))); }
  catch(e){ return false; }
}
let renderer, scene, camera, disk, stars3, raf=0, running=true, clock0=performance.now();

function initBH(){
  try {
    const cv = $('bh');
    renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: !isMobile, alpha: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, isMobile?1.2:2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.7, 6.2); camera.lookAt(0, 0, 0);

    // Starfield (drifts toward the centre — gravitational pull feel)
    const N = isMobile ? 1200 : 3200;
    const geo = new THREE.BufferGeometry(); const pos = new Float32Array(N*3);
    for (let i=0;i<N;i++){ const r=6+Math.random()*26, a=Math.random()*Math.PI*2, e=(Math.random()-.5)*14;
      pos[i*3]=Math.cos(a)*r; pos[i*3+1]=e; pos[i*3+2]=Math.sin(a)*r; }
    geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
    stars3 = new THREE.Points(geo, new THREE.PointsMaterial({ color:0x9fd8ff, size:0.05, transparent:true, opacity:.85, depthWrite:false }));
    scene.add(stars3);

    // Accretion disk (custom shader, additive — the "bloom" glow)
    const diskMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide,
      uniforms:{ uTime:{value:0} },
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`varying vec2 vUv; uniform float uTime;
        void main(){
          vec2 p=vUv-0.5; float r=length(p)*2.0; float ang=atan(p.y,p.x);
          float inner=0.34, outer=0.98;
          if(r<inner||r>outer) discard;
          float swirl=sin(ang*3.0+uTime*1.4 - r*9.0);
          float br=smoothstep(inner,inner+0.05,r)*(1.0-smoothstep(outer-0.28,outer,r));
          br*=0.55+0.45*swirl;
          vec3 col=mix(vec3(0.0,0.92,1.0),vec3(1.0,0.17,0.84),smoothstep(inner,0.6,r));
          col=mix(col,vec3(1.0,0.55,0.12),smoothstep(0.6,outer,r));
          col+=smoothstep(inner+0.04,inner,r)*vec3(0.6,0.9,1.2);   // hot photon-ring edge
          gl_FragColor=vec4(col, clamp(br,0.0,1.0));
        }`
    });
    disk = new THREE.Mesh(new THREE.PlaneGeometry(7.4, 7.4), diskMat);
    disk.rotation.x = -1.15;
    scene.add(disk);

    // Bright photon ring + dark event-horizon core
    const ring = new THREE.Mesh(new THREE.RingGeometry(1.18, 1.30, 96),
      new THREE.MeshBasicMaterial({ color:0x9fe9ff, transparent:true, opacity:.9, blending:THREE.AdditiveBlending, side:THREE.DoubleSide, depthWrite:false }));
    ring.rotation.x = -1.15; scene.add(ring);
    const core = new THREE.Mesh(new THREE.CircleGeometry(1.16, 64), new THREE.MeshBasicMaterial({ color:0x000000 }));
    core.rotation.x = -1.15; core.position.y = 0.001; scene.add(core);

    window.addEventListener('resize', onResize);
    document.addEventListener('visibilitychange', ()=>{ running = !document.hidden; if(running) loop(); });
    cv.classList.add('on');
    loop();
  } catch(e){ console.warn('black hole init failed; CSS fallback stays:', e); }
}
function onResize(){ if(!renderer) return; camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }
function loop(){
  if(!running) return;
  raf = requestAnimationFrame(loop);
  const t = (performance.now()-clock0)/1000;
  if (disk) disk.material.uniforms.uTime.value = t;
  if (stars3){
    stars3.rotation.y = t*0.02;
    const a = stars3.geometry.attributes.position.array;
    for (let i=0;i<a.length;i+=3){           // slow inward drift toward the singularity
      const dx=-a[i], dz=-a[i+2], d=Math.hypot(dx,dz)||1;
      a[i]+=dx/d*0.006; a[i+2]+=dz/d*0.006; a[i+1]*=0.9996;
      if (d<2.2){ const r=20+Math.random()*10, an=Math.random()*Math.PI*2; a[i]=Math.cos(an)*r; a[i+2]=Math.sin(an)*r; a[i+1]=(Math.random()-.5)*14; }
    }
    stars3.geometry.attributes.position.needsUpdate = true;
  }
  if (camera){ camera.position.x = Math.sin(t*0.06)*0.6; camera.lookAt(0,0,0); }
  renderer.render(scene, camera);
}

// Lazy-load Three.js only when the device can handle it (after intro paint).
if (!reduced && !isMobile && webglOK()){
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
  s.onload = () => { if (window.THREE) initBH(); };
  s.onerror = () => console.warn('three.js failed to load; CSS fallback stays');
  setTimeout(()=> document.head.appendChild(s), 400);   // let the CSS scene paint first
}
</script>
</body>
</html>
